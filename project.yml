name: Stackcident
options:
  bundleIdPrefix: com.komail
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Stackcident:
    type: application
    platform: iOS
    sources:
      - path: StackcidentApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.komail.Stackcident
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
    info:
      path: StackcidentApp/Info.plist
      properties:
        CFBundleDisplayName: Stackcident
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  StackcidentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StackcidentTests
    dependencies:
      - target: Stackcident
