name: iOS Build and Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Show build destinations
        run: xcodebuild -showdestinations -project Stackcident.xcodeproj -scheme Stackcident
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project Stackcident.xcodeproj -scheme Stackcident \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run tests on available iPhone Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next((x["udid"] for v in d.values() for x in v if "iPhone" in x["name"] and x["isAvailable"]), ""))')
          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone simulator available" >&2
            exit 1
          fi
          xcodebuild -project Stackcident.xcodeproj -scheme Stackcident \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO test
